<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestão Financeira</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{font-family:Arial,sans-serif;color:#e5e7eb;background:#07111f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0f2038);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{margin:0;font-size:24px}.muted{color:#9ca3af;font-size:14px}.btn{background:#38bdf8;color:#062033;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.btn input{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.card,.panel{background:#10233b;border:1px solid #294764;border-radius:14px;padding:18px}.label{font-size:12px;color:#9ca3af;text-transform:uppercase}.value{font-size:24px;font-weight:bold;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.panel{margin-top:14px}.panel h2{font-size:17px;margin:0 0 12px}.table-wrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #294764;white-space:nowrap}th{color:#9ca3af}#message{margin-top:14px;color:#facc15}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.value{font-size:21px}}</style></head>
<body><main class="wrap"><header class="top"><div><h1>Gestão Financeira</h1><div class="muted">Dashboard público de teste — login desativado</div></div><label class="btn">Importar planilha<input id="file" type="file" accept=".xlsx,.xls,.csv"></label></header><div id="message">Dashboard aberto. Importe a planilha Gestao-Financeira.xlsx para carregar os dados.</div><section class="grid"><article class="card"><div class="label">Ganhos</div><div id="ganhos" class="value">R$ 0,00</div></article><article class="card"><div class="label">Despesas</div><div id="despesas" class="value">R$ 0,00</div></article><article class="card"><div class="label">Saldo</div><div id="saldo" class="value">R$ 0,00</div></article></section><section class="panel"><h2>Próximas despesas</h2><div class="table-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Nenhuma planilha importada.</td></tr></tbody></table></div></section></main><script>const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);const val=x=>{if(typeof x==='number')return x;let s=String(x??'').replace(/R\$/gi,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.');return Number(s)||0};const text=x=>String(x??'').trim();document.getElementById('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;document.getElementById('message').textContent='Lendo '+f.name+'...';const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});const rs=wb.Sheets.RESUMO||wb.Sheets['VISÃO GERAL']||wb.Sheets['Visao Geral'];const ds=wb.Sheets.DESPESAS;if(!rs)throw new Error('Aba RESUMO não encontrada');const resumo=XLSX.utils.sheet_to_json(rs,{defval:''});const despesas=ds?XLSX.utils.sheet_to_json(ds,{defval:''}):[];const ganhos=resumo.reduce((a,x)=>a+val(x.TOTALGANHOS),0),gastos=resumo.reduce((a,x)=>a+val(x.TOTALDESPESAS),0),saldo=resumo.reduce((a,x)=>a+val(x.BALANÇO??x.BALANCO),0);document.getElementById('ganhos').textContent=brl(ganhos);document.getElementById('despesas').textContent=brl(gastos);const se=document.getElementById('saldo');se.textContent=brl(saldo);se.className='value '+(saldo>=0?'positive':'negative');const tbody=document.getElementById('rows');tbody.innerHTML='';despesas.filter(x=>text(x.STATUS).toUpperCase()!=='PAGO'&&String(x.PAGO).toUpperCase()!=='TRUE').slice(0,25).forEach(x=>{const tr=document.createElement('tr');[x.VENCIMENTO,x.DESCRIÇÃO,brl(val(x.VALOR)),x.STATUS||'PENDENTE'].forEach(y=>{const td=document.createElement('td');td.textContent=text(y);tr.appendChild(td)});tbody.appendChild(tr)});if(!tbody.children.length)tbody.innerHTML='<tr><td colspan="4" class="muted">Nenhuma despesa pendente.</td></tr>';document.getElementById('message').textContent='Planilha importada com sucesso.'}catch(err){console.error(err);document.getElementById('message').textContent='Erro: '+err.message}};r.readAsArrayBuffer(f)})</script></body></html>
