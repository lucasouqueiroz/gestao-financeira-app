<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Gestão Financeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-animated">
  <div id="auth-container" class="auth-container">
    <div class="auth-card animate-scale-in">
      <div class="auth-header">
        <div class="auth-logo" aria-hidden="true">GF</div>
        <h1 class="auth-title">Gestão Financeira</h1>
        <p class="auth-subtitle">Entre para acompanhar a sua vida financeira.</p>
      </div>
      <form id="auth-form" novalidate>
        <div id="auth-nome-field" class="form-group hidden">
          <label class="form-label" for="auth-nome">Nome</label>
          <input type="text" id="auth-nome" class="form-input" autocomplete="name" placeholder="Como podemos chamar você?">
        </div>
        <div class="form-group">
          <label class="form-label" for="auth-email">E-mail</label>
          <input type="email" id="auth-email" class="form-input" autocomplete="email" required placeholder="voce@exemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="auth-password">Senha</label>
          <input type="password" id="auth-password" class="form-input" autocomplete="current-password" required minlength="8" placeholder="Mínimo de 8 caracteres">
        </div>
        <p id="auth-status" class="text-muted text-sm" aria-live="polite">Carregando autenticação…</p>
        <button type="submit" id="auth-submit" class="btn btn-primary" style="width:100%;margin-top:var(--space-4)" disabled>Entrar</button>
      </form>
      <div class="auth-divider">ou</div>
      <button id="auth-toggle" type="button" class="btn btn-ghost" style="width:100%" disabled>Não tem conta? Cadastre-se</button>
    </div>
  </div>

  <div id="app" class="app-container hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header"><div class="logo-icon">GF</div><span class="logo-text">Gestão Financeira</span></div>
      <nav class="nav-menu" aria-label="Navegação principal">
        <button id="nav-dashboard" class="nav-item active" type="button">Dashboard</button>
        <button id="nav-transacoes" class="nav-item" type="button">Transações</button>
        <button id="nav-novo" class="nav-item" type="button">Novo lançamento</button>
      </nav>
      <div style="margin-top:auto;padding-top:var(--space-6);border-top:1px solid var(--gray-200)">
        <button id="btn-logout" class="btn btn-ghost" type="button" style="width:100%;justify-content:flex-start;color:var(--danger)">Sair</button>
      </div>
    </aside>
    <main id="main-content" class="main-content" aria-live="polite"></main>
  </div>

  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal" class="modal">
      <div class="modal-header"><h2 id="modal-title" class="modal-title">Novo lançamento</h2><button id="modal-close" type="button" class="modal-close" aria-label="Fechar">×</button></div>
      <form id="modal-form"></form>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
