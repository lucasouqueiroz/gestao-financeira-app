<style>
  :root {
    --bg: #0f172a;
    --card-bg: #111827;
    --card-border: #1f2937;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.15);
    --danger: #ef4444;
    --text: #e5e7eb;
    --text-soft: #9ca3af;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px;
    background-color: var(--bg);
    color: var(--text);
  }

  h1 { margin: 0 0 16px 0; font-size: 20px; }
  h2 { margin-top: 8px; margin-bottom: 8px; font-size: 16px; }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .app-header-right {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .pill {
    padding: 4px 10px;
    border-radius: 999px;
    background-color: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  label { font-size: 12px; color: var(--text-soft); }

  select, input[type="month"], input[type="date"], input[type="text"], input[type="number"] {
    background-color: #020617;
    border: 1px solid #1f2937;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-soft);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
    margin-top: 8px;
  }

  .grid-2-equal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .card {
    border: 1px solid var(--card-border);
    padding: 12px;
    border-radius: 8px;
    background-color: var(--card-bg);
    box-shadow: 0 1px 2px rgba(0,0,0,0.30);
  }

  .tabela-scroll {
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #1f2937;
    margin-top: 8px;
    border-radius: 6px;
    background-color: #020617;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 11px;
  }

  th, td {
    border-bottom: 1px solid #111827;
    padding: 4px 6px;
    white-space: nowrap;
  }

  th {
    background-color: #020617;
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: left;
    color: var(--text-soft);
    font-weight: 500;
  }

  tr:nth-child(even) td { background-color: #020617; }
  tr:nth-child(odd) td { background-color: #0b1120; }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  form input, form select { min-width: 120px; }

  form button {
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    background-color: var(--accent);
    color: #020617;
    font-weight: 500;
  }

  form button:hover { background-color: #0ea5e9; }

  .mensagem { margin-top: 8px; font-size: 11px; color: var(--text-soft); }

  .balanco-positivo { color: #22c55e; font-weight: 600; }
  .balanco-negativo { color: #f97316; font-weight: 600; }

  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10px;
  }

  .badge-pago {
    background-color: rgba(34, 197, 94, 0.15);
    color: #22c55e;
  }

  .badge-pendente {
    background-color: rgba(234, 179, 8, 0.15);
    color: #eab308;
  }

  .btn-danger {
    background-color: var(--danger);
    color: #fff;
    border-radius: 4px;
    border: none;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  .btn-danger:hover { background-color: #dc2626; }
</style>
